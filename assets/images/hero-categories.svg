<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Insurance, mutual funds, and gold investment icons representing our three service categories">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#153761"/>
      <stop offset="100%" stop-color="#1E4E8C"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4299E1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4299E1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38D9A9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38D9A9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F6C453" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F6C453" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63B3ED"/>
      <stop offset="100%" stop-color="#2B6CB0"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="coinTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#F6C453"/>
    </linearGradient>
    <linearGradient id="coinSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D69E2E"/>
      <stop offset="100%" stop-color="#9C6B08"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1F3A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="340" rx="20" fill="url(#bgGrad)"/>

  <!-- soft scattered star/sparkle accents for energy -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="120" cy="45" r="2"/>
    <circle cx="260" cy="270" r="1.6"/>
    <circle cx="480" cy="35" r="2.2"/>
    <circle cx="640" cy="290" r="1.6"/>
    <circle cx="900" cy="55" r="2"/>
    <circle cx="60" cy="220" r="1.4"/>
    <circle cx="940" cy="240" r="1.8"/>
  </g>

  <!-- connecting energetic growth line across all three -->
  <path d="M 175 240 Q 350 270 500 185 T 825 90" stroke="#FDE68A" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- ============ INSURANCE: shield with heart ============ -->
  <g transform="translate(85, 75)">
    <circle cx="80" cy="90" r="105" fill="url(#glowBlue)"/>
    <g filter="url(#softShadow)">
      <path d="M80 15 L148 40 L148 105 C148 156 114 184 80 202 C46 184 12 156 12 105 L12 40 Z" fill="url(#shieldGrad)"/>
    </g>
    <path d="M80 115 C63 92 34 95 34 120 C34 141 63 157 80 172 C97 157 126 141 126 120 C126 95 97 92 80 115 Z" fill="#FFFFFF"/>
    <text x="80" y="240" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Insurance</text>
    <text x="80" y="263" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#BEE3F8">Life &#183; Health &#183; Motor &#183; Property</text>
  </g>

  <!-- ============ MUTUAL FUNDS: ascending bar chart with arrow ============ -->
  <g transform="translate(415, 55)">
    <circle cx="85" cy="95" r="110" fill="url(#glowGreen)"/>
    <g filter="url(#softShadow)">
      <rect x="20" y="135" width="30" height="55" rx="6" fill="url(#barGrad1)"/>
      <rect x="62" y="105" width="30" height="85" rx="6" fill="url(#barGrad2)"/>
      <rect x="104" y="65" width="30" height="125" rx="6" fill="url(#barGrad3)"/>
    </g>
    <path d="M25 68 L68 38 L98 55 L148 8" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M130 8 L148 8 L148 26" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="85" y="240" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Mutual Funds</text>
    <text x="85" y="263" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#B2F5EA">SIP &#183; Equity &#183; Debt &#183; Hybrid</text>
  </g>

  <!-- ============ GOLD: stacked coins ============ -->
  <g transform="translate(765, 75)">
    <circle cx="80" cy="90" r="105" fill="url(#glowGold)"/>
    <g filter="url(#softShadow)">
      <ellipse cx="80" cy="145" rx="55" ry="16" fill="url(#coinSide)"/>
      <ellipse cx="80" cy="127" rx="55" ry="16" fill="url(#coinSide)"/>
      <ellipse cx="80" cy="109" rx="55" ry="16" fill="url(#coinSide)"/>
      <ellipse cx="80" cy="91" rx="55" ry="16" fill="url(#coinTop)"/>
      <circle cx="80" cy="91" r="34" fill="none" stroke="#B7791F" stroke-width="2" opacity="0.5"/>
    </g>
    <text x="80" y="98" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800" fill="#7B5A00">Au</text>
    <text x="80" y="240" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Gold</text>
    <text x="80" y="263" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#FEEBC8">ETF &#183; Gold Fund &#183; SGB</text>
  </g>
</svg>