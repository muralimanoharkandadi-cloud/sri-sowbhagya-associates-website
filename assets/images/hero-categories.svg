<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Insurance, mutual funds, and gold investment icons representing our three service categories">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECC94B"/>
      <stop offset="100%" stop-color="#D69E2E"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B6CB0"/>
      <stop offset="100%" stop-color="#1A365D"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="320" rx="18" fill="url(#bgGrad)"/>

  <!-- connecting dotted growth line across all three -->
  <path d="M 160 230 Q 350 260 500 190 T 840 100" stroke="#CBD5E0" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>

  <!-- ============ INSURANCE: shield with heart ============ -->
  <g transform="translate(90, 90)">
    <circle cx="70" cy="70" r="88" fill="#FFFFFF" opacity="0.6"/>
    <path d="M70 10 L130 32 L130 90 C130 135 100 160 70 175 C40 160 10 135 10 90 L10 32 Z"
          fill="url(#navyGrad)"/>
    <path d="M70 95 C55 75 30 78 30 100 C30 118 55 132 70 145 C85 132 110 118 110 100 C110 78 85 75 70 95 Z"
          fill="#FFFFFF"/>
    <text x="70" y="205" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#1A365D">Insurance</text>
    <text x="70" y="228" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#718096">Life &#183; Health &#183; Motor &#183; Property</text>
  </g>

  <!-- ============ MUTUAL FUNDS: ascending bar chart with arrow ============ -->
  <g transform="translate(430, 60)">
    <circle cx="70" cy="80" r="88" fill="#FFFFFF" opacity="0.6"/>
    <rect x="20" y="120" width="24" height="45" rx="4" fill="#90CDF4"/>
    <rect x="54" y="95" width="24" height="70" rx="4" fill="#2B6CB0"/>
    <rect x="88" y="65" width="24" height="100" rx="4" fill="#1A365D"/>
    <path d="M25 60 L60 35 L85 50 L125 15" stroke="#D69E2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M112 15 L125 15 L125 28" stroke="#D69E2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="205" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#1A365D">Mutual Funds</text>
    <text x="70" y="228" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#718096">SIP &#183; Equity &#183; Debt &#183; Hybrid</text>
  </g>

  <!-- ============ GOLD: stacked coins / bar ============ -->
  <g transform="translate(770, 90)">
    <circle cx="70" cy="70" r="88" fill="#FFFFFF" opacity="0.6"/>
    <ellipse cx="70" cy="118" rx="46" ry="14" fill="url(#goldGrad)"/>
    <ellipse cx="70" cy="102" rx="46" ry="14" fill="url(#goldGrad)"/>
    <ellipse cx="70" cy="86" rx="46" ry="14" fill="url(#goldGrad)"/>
    <ellipse cx="70" cy="70" rx="46" ry="14" fill="#F6E05E"/>
    <text x="70" y="75" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#7B5A00">Au</text>
    <text x="70" y="205" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#1A365D">Gold</text>
    <text x="70" y="228" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#718096">ETF &#183; Gold Fund &#183; SGB</text>
  </g>
</svg>